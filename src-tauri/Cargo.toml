[package]
name = "qingjian"
version = "0.1.0"
description = "青简 - 轻量、现代、开源、本地优先的个人工作台"
authors = ["青简"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qingjian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# 默认不启用自定义协议
default = []
