[package]
name = "qingjian"
version = "0.5.0"
description = "青简 - 轻量、现代、开源、本地优先的个人工作台"
authors = ["青简"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qingjian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 桌面端 AI 中转（审查 C-2/C-3）：rustls-tls 避免对系统 OpenSSL 的依赖，跨平台可复现构建
# default-features=false 去除 native-tls（OpenSSL），仅保留所需特性（审查 M-9）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
# SSRF 防护（审查 H-1）：spawn_blocking 做阻塞式 DNS 解析、time::timeout 做流式分块超时（L-3），
# 复用 tauri 已引入的 tokio 1.x，仅开启所需特性。
tokio = { version = "1", features = ["rt", "time"] }

[features]
# 默认不启用自定义协议
default = []
