name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Tauri build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '青简 ${{ github.ref_name }}'
          args: ${{ matrix.args }}

  # Android APK 构建（M5）：需在仓库 Settings → Secrets 配置
  #   KEY_ALIAS / KEY_PASSWORD / KEYSTORE_BASE64（可选；未配置则用 debug key 构建）
  android:
    runs-on: ubuntu-latest
    # secrets 上下文不能在 if: 中直接引用，故先在 job 级 env 计算存在性，再于 step 的 if 中引用
    env:
      KEYSTORE_SET: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
      - name: Capture Android home path
        # setup-android 将 ANDROID_HOME 设为 shell 环境变量（无稳定的 action 输出名），
        # 故在 shell 中捕获到 $GITHUB_ENV 供后续步骤复用。
        run: echo "ANDROID_HOME_DIR=${ANDROID_HOME:-$HOME/Android/Sdk}" >> "$GITHUB_ENV"
      - name: Install Android SDK components
        # setup-android 已 sdkmanager --licenses 接受许可，此处用 yes | 兜底非交互安装。
        # compileSdk/targetSdk 为 36（gen/android/app/build.gradle.kts），platform 必须与其一致，
        # 否则 AGP 报 "failed to find target SDK 36"。
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"
      - name: Locate NDK and link clang into PATH
        # 关键点：不要硬编码 NDK 路径。先定位真实安装的 NDK 目录，再探测各 ABI 的 clang 名称
        #（NDK 里带 API 版本号，如 aarch64-linux-android34-clang / armv7a-linux-androideabi34-clang），
        # 建立「不带版本号」的符号链接供 cc-rs 与 Rust 链接器识别。
        # 注意：NDK 的 clang 是包装脚本，内部用 $(dirname "$0")/clang 定位真正的编译器，
        # 故软链必须建在 NDK bin 目录内（而非单独的 ndk-bin 目录），否则 $0 的 dirname 错位、
        # 找不到 clang。同时把整个 NDK bin 目录加入 PATH，供 Rust 最终链接（clang/ld.lld/llvm-ar）。
        # 各 Rust target 对应的 NDK clang 名（NDK 25 的 armv7 带 'a'，与 Rust target 名不同）：
        #   aarch64-linux-android      -> aarch64-linux-android-clang
        #   armv7-linux-androideabi    -> armv7a-linux-androideabi-clang
        #   i686-linux-android         -> i686-linux-android-clang
        #   x86_64-linux-android       -> x86_64-linux-android-clang
        # 与 .cargo/config.toml 的 [target.*].linker 一一对应。
        run: |
          set -euo pipefail
          AH="${ANDROID_HOME_DIR:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -d "$AH/ndk/25.2.9519653" ]; then
            NDK_DIR="$AH/ndk/25.2.9519653"
          else
            NDK_DIR="$(ls -d "$AH"/ndk/*/ 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No NDK installation found under $AH/ndk"; exit 1
          fi
          echo "ANDROID_NDK_DIR=${NDK_DIR%/}" >> "$GITHUB_ENV"
          echo "Resolved NDK dir: $NDK_DIR"
          NDK_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for ABI in aarch64-linux-android armv7a-linux-androideabi i686-linux-android x86_64-linux-android; do
            CLANG_REL="$(ls "$NDK_BIN"/"$ABI"*-clang 2>/dev/null | grep -v 'clang++' | head -n1 | xargs -n1 basename || true)"
            CLANGXX_REL="$(ls "$NDK_BIN"/"$ABI"*-clang++ 2>/dev/null | head -n1 | xargs -n1 basename || true)"
            if [ -z "$CLANG_REL" ]; then
              echo "::error::NDK clang not found for $ABI under $NDK_BIN"; ls -la "$NDK_BIN" || true; exit 1
            fi
            echo "Linking $ABI-clang <- $CLANG_REL"
            ln -sf "$CLANG_REL" "$NDK_BIN/$ABI-clang"
            ln -sf "$CLANGXX_REL" "$NDK_BIN/$ABI-clang++"
          done
          ln -sf llvm-ar "$NDK_BIN/aarch64-linux-android-ar"
          ln -sf llvm-ar "$NDK_BIN/armv7a-linux-androideabi-ar"
          ln -sf llvm-ar "$NDK_BIN/i686-linux-android-ar"
          ln -sf llvm-ar "$NDK_BIN/x86_64-linux-android-ar"
          # 把 NDK bin 加入 PATH：cc-rs 按 $ABI-clang 找编译器，
          # rustc 链接阶段还需 clang / ld.lld / llvm-ar（均位于 NDK bin）。
          echo "$NDK_BIN" >> "$GITHUB_PATH"
      - name: Decode signing keystore
        if: env.KEYSTORE_SET == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore
      - run: pnpm install --frozen-lockfile
      - name: Tauri Android build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_NDK_DIR }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_DIR }}
          # rustc 最终链接 cdylib（libqingjian_lib.so）的 linker 已由仓库根 .cargo/config.toml
          # 配置（[target.*].linker 指向 NDK bin 内无版本号软链名），cargo 无论从 gradle 还是
          # 直接调用都会读取，不依赖环境变量透传（Gradle daemon 不继承此步骤的自定义 env）。
          # 此处仅保留 cc-rs / build script（如 ring）需要的编译器名，作 PATH 兜底。
          CC_aarch64_linux_android: aarch64-linux-android-clang
          CXX_aarch64_linux_android: aarch64-linux-android-clang++
          AR_aarch64_linux_android: aarch64-linux-android-ar
          # 签名（可选，未配置 Secrets 时用 debug key 构建）
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '青简 ${{ github.ref_name }}'
          args: --target aarch64-linux-android
