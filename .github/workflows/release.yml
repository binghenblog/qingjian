name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Tauri build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '青简 ${{ github.ref_name }}'
          args: ${{ matrix.args }}

  # Android APK 构建（M5）：需在仓库 Settings → Secrets 配置
  #   KEY_ALIAS / KEY_PASSWORD / KEYSTORE_BASE64（可选；未配置则用 debug key 构建）
  android:
    runs-on: ubuntu-latest
    # secrets 上下文不能在 if: 中直接引用，故先在 job 级 env 计算存在性，再于 step 的 if 中引用
    env:
      KEYSTORE_SET: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
      - name: Link NDK clang into PATH
        # cc-rs 按 aarch64-linux-android-clang 这个名字在 PATH 上找编译器，
        # 而 NDK 的 clang 实际叫 aarch64-linux-android34-clang（带 API 版本号），
        # 故建立不带版本号的软链并加入 PATH（同时供 Rust 标准库链接器使用）。
        run: |
          NDK_BIN="${{ steps.setup-android.outputs.android-home }}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p "$HOME/ndk-bin"
          ln -sf "$NDK_BIN/aarch64-linux-android34-clang" "$HOME/ndk-bin/aarch64-linux-android-clang"
          ln -sf "$NDK_BIN/aarch64-linux-android34-clang++" "$HOME/ndk-bin/aarch64-linux-android-clang++"
          ln -sf "$NDK_BIN/llvm-ar" "$HOME/ndk-bin/aarch64-linux-android-ar"
          echo "$HOME/ndk-bin" >> "$GITHUB_PATH"
      - name: Decode signing keystore
        if: env.KEYSTORE_SET == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore
      - run: pnpm install --frozen-lockfile
      - name: Tauri Android build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-android.outputs.android-home }}/ndk/25.2.9519653
          ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.android-home }}/ndk/25.2.9519653
          # cc-rs / Rust 交叉编译工具链需要显式指明 NDK clang 路径（双保险，避免找不到 aarch64-linux-android-clang）
          CC_aarch64_linux_android: ${{ steps.setup-android.outputs.android-home }}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          CXX_aarch64_linux_android: ${{ steps.setup-android.outputs.android-home }}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++
          AR_aarch64_linux_android: ${{ steps.setup-android.outputs.android-home }}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          # 签名（可选，未配置 Secrets 时用 debug key 构建）
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '青简 ${{ github.ref_name }}'
          args: --target aarch64-linux-android
