name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Tauri build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '青简 ${{ github.ref_name }}'
          args: ${{ matrix.args }}

  # Android APK 构建（M5）：需在仓库 Settings → Secrets 配置
  #   KEY_ALIAS / KEY_PASSWORD / KEYSTORE_BASE64（可选；未配置则用 debug key 构建）
  android:
    runs-on: ubuntu-latest
    # secrets 上下文不能在 if: 中直接引用，故先在 job 级 env 计算存在性，再于 step 的 if 中引用
    env:
      KEYSTORE_SET: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
      - name: Capture Android home path
        # setup-android 将 ANDROID_HOME 设为 shell 环境变量（无稳定的 action 输出名），
        # 故在 shell 中捕获到 $GITHUB_ENV 供后续步骤复用。
        run: echo "ANDROID_HOME_DIR=${ANDROID_HOME:-$HOME/Android/Sdk}" >> "$GITHUB_ENV"
      - name: Install Android SDK components
        # setup-android 已 sdkmanager --licenses 接受许可，此处用 yes | 兜底非交互安装
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
      - name: Locate NDK and link clang into PATH
        # 关键点：不要硬编码 NDK 路径。先定位真实安装的 NDK 目录，再探测其 clang 名称
        #（不同 NDK 版本带/不带 API 版本号，如 aarch64-linux-android34-clang），
        # 建立不带版本号的软链 aarch64-linux-android-clang 加入 PATH，
        # 供 ring@0.17.14 的 cc-rs 与 Rust 标准库链接器识别。
        run: |
          set -euo pipefail
          AH="${ANDROID_HOME_DIR:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -d "$AH/ndk/25.2.9519653" ]; then
            NDK_DIR="$AH/ndk/25.2.9519653"
          else
            NDK_DIR="$(ls -d "$AH"/ndk/*/ 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No NDK installation found under $AH/ndk"; exit 1
          fi
          echo "ANDROID_NDK_DIR=${NDK_DIR%/}" >> "$GITHUB_ENV"
          echo "Resolved NDK dir: $NDK_DIR"
          NDK_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$(ls "$NDK_BIN"/aarch64-linux-android*-clang 2>/dev/null | head -n1 || true)"
          CLANGXX="$(ls "$NDK_BIN"/aarch64-linux-android*-clang++ 2>/dev/null | head -n1 || true)"
          if [ -z "$CLANG" ] || [ ! -e "$CLANG" ]; then
            echo "::error::NDK clang not found under $NDK_BIN"; ls -la "$NDK_BIN" || true; exit 1
          fi
          echo "Using NDK clang: $CLANG"
          mkdir -p "$HOME/ndk-bin"
          ln -sf "$CLANG" "$HOME/ndk-bin/aarch64-linux-android-clang"
          ln -sf "$CLANGXX" "$HOME/ndk-bin/aarch64-linux-android-clang++"
          ln -sf "$NDK_BIN/llvm-ar" "$HOME/ndk-bin/aarch64-linux-android-ar"
          echo "$HOME/ndk-bin" >> "$GITHUB_PATH"
      - name: Decode signing keystore
        if: env.KEYSTORE_SET == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore
      - run: pnpm install --frozen-lockfile
      - name: Tauri Android build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_NDK_DIR }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_DIR }}
          # cc-rs / Rust 交叉编译工具链按 aarch64-linux-android-clang（不带版本号）在 PATH 上找编译器；
          # 该名字已由上一步入 PATH 的软链提供，这里再显式声明双保险。
          CC_aarch64_linux_android: aarch64-linux-android-clang
          CXX_aarch64_linux_android: aarch64-linux-android-clang++
          AR_aarch64_linux_android: aarch64-linux-android-ar
          # 签名（可选，未配置 Secrets 时用 debug key 构建）
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '青简 ${{ github.ref_name }}'
          args: --target aarch64-linux-android
